apiVersion: v1
kind: ConfigMap

metadata:
  name: prometheus-config
  namespace: fraud-detection

data:
  prometheus.yml: |
    global:
      scrape_interval: 5s

    scrape_configs:
      - job_name: "fraud-api"

        metrics_path: /metrics

        static_configs:
          - targets:
              - fraud-api-service:8000