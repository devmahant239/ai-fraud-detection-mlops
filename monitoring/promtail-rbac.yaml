apiVersion: v1
kind: ServiceAccount

metadata:
  name: promtail
  namespace: fraud-detection


---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole

metadata:
  name: promtail

rules:
  - apiGroups:
      - ""

    resources:
      - pods
      - nodes
      - nodes/proxy
      - services

    verbs:
      - get
      - watch
      - list


---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding

metadata:
  name: promtail

subjects:
  - kind: ServiceAccount
    name: promtail
    namespace: fraud-detection

roleRef:
  kind: ClusterRole
  name: promtail
  apiGroup: rbac.authorization.k8s.io