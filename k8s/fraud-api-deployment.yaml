apiVersion: apps/v1
kind: Deployment

metadata:
  name: fraud-api
  namespace: fraud-detection

spec:
  replicas: 2

  selector:
    matchLabels:
      app: fraud-api

  template:
    metadata:
      labels:
        app: fraud-api

    spec:
      containers:
        - name: fraud-api

          image: dev239/fraud-detection-api:latest

          imagePullPolicy: Always

          envFrom:
            - configMapRef:
                name: fraud-api-config

            - secretRef:
                name: fraud-api-secret

          ports:
            - containerPort: 8000

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"