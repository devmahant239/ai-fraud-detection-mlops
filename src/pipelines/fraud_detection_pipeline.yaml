pipelineInfo:
  description: End-to-end MLOps pipeline for fraud detection
  name: ai-fraud-detection-mlops-pipeline
root:
  dag:
    tasks:
      drift-decision-component:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-drift-decision-component
        dependentTasks:
        - drift-detection-component
        taskInfo:
          name: drift-decision-component
      drift-detection-component:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-drift-detection-component
        dependentTasks:
        - promote-model-component
        taskInfo:
          name: drift-detection-component
      export-data-component:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-export-data-component
        taskInfo:
          name: export-data-component
      feature-engineering-component:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-feature-engineering-component
        dependentTasks:
        - validate-data-component
        taskInfo:
          name: feature-engineering-component
      promote-model-component:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-promote-model-component
        dependentTasks:
        - train-model-component
        taskInfo:
          name: promote-model-component
      train-model-component:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-train-model-component
        dependentTasks:
        - feature-engineering-component
        taskInfo:
          name: train-model-component
      validate-data-component:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-validate-data-component
        dependentTasks:
        - export-data-component
        taskInfo:
          name: validate-data-component
schemaVersion: 2.1.0
sdkVersion: kfp-2.16.1
