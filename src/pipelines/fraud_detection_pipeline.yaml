# PIPELINE DEFINITION
# Name: ai-fraud-detection-mlops-pipeline
# Description: End-to-end MLOps pipeline for fraud detection
components:
  comp-drift-decision-component:
    executorLabel: exec-drift-decision-component
  comp-drift-detection-component:
    executorLabel: exec-drift-detection-component
  comp-export-data-component:
    executorLabel: exec-export-data-component
  comp-feature-engineering-component:
    executorLabel: exec-feature-engineering-component
  comp-promote-model-component:
    executorLabel: exec-promote-model-component
  comp-train-model-component:
    executorLabel: exec-train-model-component
  comp-validate-data-component:
    executorLabel: exec-validate-data-component
deploymentSpec:
  executors:
    exec-drift-decision-component:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - drift_decision_component
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'kfp==2.16.1'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef drift_decision_component():\n    import subprocess\n    subprocess.run([\"\
          python\", \"src/monitoring/drift_decision.py\"], check=True)\n\n"
        image: dev239/fraud-detection-api:dev
